<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Dominion University | Reset Password</title>
    <link rel="stylesheet" href="styles.css" />
    <link rel="icon" type="image/png" href="no_back.png" />
    <script src="app.js" defer></script>
    <script src="supabase-client-frontend.js" defer></script>
  </head>
  <body class="auth-page">
    <div class="auth-card">
      <div class="auth-header">
        <div class="mini-logo-wrap">
          <img src="sharp.png" alt="Dominion University logo" class="mini-logo-img" />
        </div>
        <h2>Reset Password</h2>
      </div>

      <form id="forgotPasswordForm" class="reset-form">
        <label>
          <span>Email Address</span>
          <input type="email" id="resetEmail" placeholder="Enter your email" required />
        </label>

        <button type="submit" class="primary-btn reset-btn">Send 6-digit code</button>
      </form>

      <form id="resetCodeForm" class="reset-form hidden">
        <label>
          <span>6-digit Code</span>
          <input type="text" id="resetCode" maxlength="6" placeholder="Enter code" required />
        </label>

        <label>
          <span>New Password</span>
          <input type="password" id="newPassword" placeholder="Create a new password" required />
        </label>

        <label>
          <span>Confirm Password</span>
          <input type="password" id="confirmPassword" placeholder="Confirm new password" required />
        </label>

        <button type="submit" class="primary-btn reset-btn">Update Password</button>
      </form>

      <p id="resetMessage" class="reset-message" role="status"></p>

      <div class="auth-footer">
        <a href="login.html">Back to Login</a>
      </div>
    </div>
  </body>
</html>
